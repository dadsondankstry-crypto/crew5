name: Gerar APK Minha Escala

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verificar Android SDK do runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK nao encontrado no runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK localizado em $SDK_ROOT"
          ls "$SDK_ROOT/platforms" || true
          ls "$SDK_ROOT/build-tools" || true
          if [[ ! -d "$SDK_ROOT/platforms/android-35" ]]; then
            echo "::error::Plataforma Android 35 nao esta instalada no runner."
            exit 1
          fi
          if [[ ! -d "$SDK_ROOT/build-tools/35.0.0" ]]; then
            echo "::error::Build Tools 35.0.0 nao estao instalados no runner."
            exit 1
          fi

      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MinhaEscala-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
